name: Pull Request
on:
  pull_request:
    branches:
      - master
      - main
      - 2.x

env:
  TERMINUS_TOKEN: ${{ secrets.TERMINUS_TOKEN }}
  TERMINUS_EMAIL: ${{ secrets.TERMINUS_EMAIL }}
  TERMINUS_ORG: ${{ secrets.TERMINUS_ORG }}
  GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
  TZ: "/usr/share/zoneinfo/America/Los_Angeles"
  TERM: dumb
  GITHUB_RUN_NUMBER: ${{ github.run_number }}
  COMMIT_SHA: ${{ github.sha }}
  PUBLIC_KEY: ${{ secrets.PANTHEON_PLATFORM_DEPLOY_KEY_PUBLIC }}
  PRIVATE_KEY: ${{ secrets.PANTHEON_PLATFORM_DEPLOY_KEY_PRIVATE }}
  BASH_ENV: ~/.bashrc
  WORKSPACE: ${{ github.workspace }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  REF: ${{ github.ref }}

concurrency:
  group: 'ci-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:

  phpcompatibility:
    runs-on: ubuntu-latest
    name: PHP Compatibility
    steps:

      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0

      - name: PHPCompatibility
        uses: pantheon-systems/phpcompatibility-action@7bf1b2881e207c80ad4569874ceee225f59537d1 # v1.1.1
        with:
          test-versions: 8.1
          ## Soft deprecation of 7.4. Doesn't make it incompatible
          ## just doesn't make sure it is compatible.

  linting:
    runs-on: ubuntu-latest
    name: Code linting
    steps:

      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0

      - name: Composer install
        run: composer install

      - name: Code sniff
        run: composer run-script code:lint

  build_test:
    needs: [ linting, phpcompatibility ]
    strategy:
      matrix:
        drupal-version: [ 10, 11 ]
    runs-on: ubuntu-latest
    name: Build and test (Drupal)
    env:
      DRUPAL_VERSION: ${{ matrix.drupal-version }}
    steps:

      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2
        with:
          php-version: "8.1"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Terminus
        uses: pantheon-systems/terminus-github-actions@8e024bd89ff46ed2aa4e0663c6b54c87a94344f8 # v1.2.7
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_TOKEN }}
          disable-cache: true
          terminus-version: 3.6.2

      - name: Login Pantheon Git
        run: |
          git config --global user.email "$GIT_EMAIL"
          git config --global user.name "Github Actions"
          git config --global --add safe.directory '*'

      - name: Ensure login to Terminus
        run: |
          terminus auth:whoami

      - name: Setup SSH Keys
        uses: webfactory/ssh-agent@5f066a372ec13036ab7cb9a8adf18c936f8d2043 # v0.5.3
        with:
          ssh-private-key: ${{ secrets.TERMINUS_CI_RSA_PRIVATE }}

      - name: Composer install
        run: composer install --ignore-platform-req=php

      - name: Setup tmate session
        if: ${{ github.event.inputs.tmate_enabled == 1 }}
        uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3.23

      - name: Run tests
        run: |
          ./vendor/bin/robo test:full $DRUPAL_VERSION
